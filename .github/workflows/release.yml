name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools cppcheck rpm dpkg-dev

      - name: Extract release version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Write release version to version file
        run: echo "${{ steps.version.outputs.version }}" > db2delta/version

      - name: Build libstaticdb2
        run: make lib

      - name: Test libstaticdb2
        run: make test

      - name: Lint libstaticdb2
        run: make lint

      - name: Build and test db2delta
        run: make db2delta && make db2delta-test && make db2delta-lint

      - name: Package db2delta (release build — no SNAPSHOT suffix)
        run: make -C db2delta package BUILD_TYPE=RELEASE

      - name: Locate packages
        id: packages
        run: |
          RPM=$(find db2delta/target/rpmbuild/RPMS -name '*.rpm' | head -1)
          DEB=$(find db2delta/target -maxdepth 1 -name '*.deb' | head -1)
          echo "rpm=${RPM}" >> "$GITHUB_OUTPUT"
          echo "deb=${DEB}" >> "$GITHUB_OUTPUT"
          echo "RPM: ${RPM}"
          echo "DEB: ${DEB}"

      - name: Upload RPM to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.packages.outputs.rpm }}

      - name: Upload DEB to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.packages.outputs.deb }}

      - name: Bump PATCH version and commit next SNAPSHOT
        run: |
          RELEASED="${{ steps.version.outputs.version }}"
          # Increment patch: 1.0.3 → 1.0.4
          MAJOR=$(echo "$RELEASED" | cut -d. -f1)
          MINOR=$(echo "$RELEASED" | cut -d. -f2)
          PATCH=$(echo "$RELEASED" | cut -d. -f3)
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "$NEXT" > db2delta/version
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db2delta/version
          git commit -m "chore: begin ${NEXT}-SNAPSHOT after ${RELEASED} release [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
